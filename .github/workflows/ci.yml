name: CI

# Control when the workflow will run
on:
  # Pushes to the long-lived branches. Pushes to other branches are covered by
  # `pull_request` as soon as a pull request exists; reacting to both events
  # there would build every pull request twice.
  push:
    branches:
      - main
      - dev
      - 'ET_*'
      - 'ETX_*'
      - 'EUET_*'
  # Pull requests, including those from forks. Those never trigger `push` in
  # this repository, so this is their only source of CI.
  pull_request:
  # Allow running this workflow manually from the Actions tab, or with
  # `gh workflow run ci.yml --ref <branch>`. Only a manual run builds the full
  # matrix (see `strategy` below).
  workflow_dispatch:

# Supersede an in-flight run when a newer commit arrives for the same branch.
# Note this is *not* the repository-wide serialisation the previous, commented
# out version of this block described (`group: carpetx`, cancel-in-progress
# false): the group is per branch, so unrelated branches still build in
# parallel, and a superseded run is cancelled rather than queued behind others.
#
# `head_ref` is the source branch on a `pull_request` and empty otherwise, so a
# pull request groups by its own branch name and a push groups by its ref.
# Cancelling is restricted to pull requests: a push to `main` or to an `ET_*`
# branch should always finish, because that result is the record of whether the
# commit built, and there is nothing to supersede it with.
concurrency:
  group: ${{github.workflow}}-${{github.head_ref || github.ref}}
  cancel-in-progress: ${{github.event_name == 'pull_request'}}

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job
  download-build-test:
    # Pushes and pull requests build two configurations: the one that runs the
    # testsuite, and one CUDA build to catch nvcc-only errors (for example
    # c9d9bcc). A manual run builds all seven. GitHub disabled Actions on this
    # fork for its usage in October 2026, when every push built all seven
    # (about 2.4 runner-hours, 70% of it in the build-only GPU jobs).
    #
    # The full list has no rocm debug (uses too much memory?), no rocm real32,
    # and no real32 optimize.
    #
    # The block scalar folds into one line, so the value is a single `${{ }}`
    # expression and evaluates to an array rather than a string.
    strategy:
      matrix:
        include: >-
          ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[
          {"accelerator": "cpu", "real-precision": "real32", "mode": "debug"},
          {"accelerator": "cpu", "real-precision": "real64", "mode": "debug"},
          {"accelerator": "cpu", "real-precision": "real64", "mode": "optimize"},
          {"accelerator": "cuda", "real-precision": "real32", "mode": "debug"},
          {"accelerator": "cuda", "real-precision": "real64", "mode": "debug"},
          {"accelerator": "cuda", "real-precision": "real64", "mode": "optimize"},
          {"accelerator": "rocm", "real-precision": "real64", "mode": "optimize"}
          ]' || '[
          {"accelerator": "cpu", "real-precision": "real64", "mode": "optimize"},
          {"accelerator": "cuda", "real-precision": "real64", "mode": "debug"}
          ]') }}
    env:
      ACCELERATOR: ${{matrix.accelerator}}
      REAL_PRECISION: ${{matrix.real-precision}}
      MODE: ${{matrix.mode}}

    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    container: lwji/carpetx:${{matrix.accelerator}}-${{matrix.real-precision}}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Check out the repository under $GITHUB_WORKSPACE, so our job can access it
      - uses: actions/checkout@v4

      - name: Log the triggering commit
        run: echo ${{github.event.client_payload.trigger}}

      # The option lists call the C and C++ compilers through ccache, which keeps
      # compiled objects in $GITHUB_WORKSPACE/.ccache. That directory is restored
      # here and saved after the build under a new key per run. The restore takes
      # the newest entry saved by the same configuration on this branch, or else
      # on `dev`, the default branch, which every run may read.
      - name: Restore ccache
        id: restore-ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{matrix.accelerator}}-${{matrix.real-precision}}-${{matrix.mode}}-${{github.run_id}}-${{github.run_attempt}}
          restore-keys: ccache-${{matrix.accelerator}}-${{matrix.real-precision}}-${{matrix.mode}}-

      # The images do not ship ccache
      - name: Set up ccache
        run: |
          command -v ccache >/dev/null || {
            apt-get update -q
            DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends ccache
          }
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
          ccache --version | head -n 1
          ccache --zero-stats

      - name: Download Cactus
        run: /bin/bash $GITHUB_WORKSPACE/scripts/download.sh

      - name: Build Cactus
        run: /bin/bash $GITHUB_WORKSPACE/scripts/build.sh

      # Also after a failed build, so that the next run starts from what did
      # compile, and before the tests, so that a run cancelled during them still
      # keeps its objects
      - name: Show ccache statistics
        if: ${{!cancelled()}}
        run: ccache --show-stats --verbose

      - name: Save ccache
        if: ${{!cancelled()}}
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{steps.restore-ccache.outputs.cache-primary-key}}

      - name: Test Cactus
        # We cannot run on accelerators. Single precision output is not accurate enough. Debug builds run too slowly.
        if: ${{matrix.accelerator == 'cpu' && matrix.real-precision == 'real64' && matrix.mode == 'optimize'}}
        run: /bin/bash $GITHUB_WORKSPACE/scripts/test.sh
